<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#4F46E5" />
    <meta name="description" content="EduFlow - Tuition & Education Management System. Real-time attendance, QR scanning, class scheduling, and academic progress tracking." />
    <title>EduFlow - Tuition Management System</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%234F46E5' stroke-width='2.4' stroke-linecap='round'%3E%3Cpath d='M4 8c3-3 5-3 8 0s5 3 8 0'/%3E%3Cpath d='M4 15c3-3 5-3 8 0s5 3 8 0' opacity='0.65'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      // Strip legacy hash (#/...) and rewrite immediately to clean path
      try {
        if (window.location.hash.startsWith("#/")) {
          var cleanPath = window.location.hash.slice(1);
          window.history.replaceState(null, "", cleanPath);
        }
      } catch (e) {}
      try {
        var m = localStorage.getItem("eduflow-theme") || "light";
        var dark = m === "dark" || (m === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
